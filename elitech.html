<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ELITECH: проект ELMMY. Шейдинг, анимация и рендер для 3D-визуала с архитектурным CGI."
    />
    <title>ELMMY | ELITECH</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <canvas class="smoke-background" data-smoke-color="#d8d8d8" aria-hidden="true"></canvas>
    <svg class="glass-filter" aria-hidden="true">
      <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
        <feTurbulence type="fractalNoise" baseFrequency="0.001 0.005" numOctaves="1" seed="17" result="turbulence" />
        <feComponentTransfer in="turbulence" result="mapped">
          <feFuncR type="gamma" amplitude="1" exponent="10" offset="0.5" />
          <feFuncG type="gamma" amplitude="0" exponent="1" offset="0" />
          <feFuncB type="gamma" amplitude="0" exponent="1" offset="0.5" />
        </feComponentTransfer>
        <feGaussianBlur in="turbulence" stdDeviation="3" result="softMap" />
        <feSpecularLighting in="softMap" surfaceScale="5" specularConstant="1" specularExponent="100" lightingColor="white" result="specLight">
          <fePointLight x="-200" y="-200" z="300" />
        </feSpecularLighting>
        <feComposite in="specLight" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="litImage" />
        <feDisplacementMap in="SourceGraphic" in2="softMap" scale="120" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <a class="skip-link" href="#main">К контенту</a>

    <header class="site-header glass-panel" aria-label="Навигация">
      <a class="brand" href="./index.html" aria-label="ELMMY на главный экран">ELMMY</a>
      <nav class="nav" aria-label="Основные разделы">
        <a href="./index.html#projects">Назад</a>
        <a href="#video">Видео</a>
        <a href="#process">Материалы</a>
        <a href="./index.html#contact">Контакты</a>
      </nav>
      <button class="language-toggle" type="button" data-lang-toggle aria-label="Switch language" aria-pressed="false">
        <span data-lang-label>EN</span>
      </button>
    </header>

    <main id="main">
      <section class="case-intro case-intro-with-video" id="video" aria-labelledby="case-title">
        <div class="case-intro-copy reveal">
          <h1 id="case-title">ELITECH</h1>
          <p class="case-lead">Обязанности на проекте: шейдинг, анимация, рендер.</p>
        </div>
        <dl class="case-meta reveal glass-panel" aria-label="Информация о проекте">
          <div>
            <dt>Формат</dt>
            <dd>Архитектурный CGI</dd>
          </div>
          <div>
            <dt>Зона работы</dt>
            <dd>Shading / Motion / Render</dd>
          </div>
        </dl>
        <div class="case-video reveal glass-panel">
          <iframe
            src="https://player.vimeo.com/video/925385788?title=0&byline=0&portrait=0"
            title="ELITECH video"
            allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
            allowfullscreen
          ></iframe>
        </div>
      </section>

      <section class="section case-process" id="process" aria-labelledby="case-process-title">
        <div class="section-heading reveal">
        </div>
        <div class="case-gif-grid">
          <figure class="case-gif-card reveal glass-panel">
            <video autoplay muted loop playsinline preload="metadata" aria-label="ELITECH: анимационный фрагмент 01">
              <source src="./assets/projects/elitech/elitech-01.mp4" type="video/mp4" />

            </video>
